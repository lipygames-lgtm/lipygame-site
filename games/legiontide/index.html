<style>
@font-face { font-family: "Baloo 2"; font-weight: 800; src: url(fonts/baloo2-800.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; font-display: block; }
@font-face { font-family: "Baloo 2"; font-weight: 800; src: url(fonts/baloo2-ext-800.woff2) format("woff2"); unicode-range: U+0100-024F, U+1E00-1EFF; font-display: block; }
:root { --ink: #1b1440; --green: #3ddc6a; --green-d: #1f9e45; --blue: #2f6bff; --blue-d: #1a3fb8; --gold: #ffc21a; --gold-d: #e08a00; --red: #ff3b4e; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd8ff; font-family: "Baloo 2", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#hud, #pops { position: fixed; inset: 0; pointer-events: none; } #pops { z-index: 5; }
#hud button, #bMonarch, #raidWarn, .menu-raid { pointer-events: auto; } #bMonarch { cursor: pointer; }
.top { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; justify-content: space-between; padding: 18px 22px; gap: 14px; }
.round { width: 58px; height: 58px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; box-shadow: 0 5px 0 var(--blue-d), 0 9px 16px rgba(27,20,64,.25); background: linear-gradient(#5a8bff, var(--blue)); position: relative; }
.round::after { content: ""; position: absolute; left: 22%; right: 22%; top: 9%; height: 26%; border-radius: 99px; background: rgba(255,255,255,.35); }
.round svg { width: 28px; height: 28px; fill: #fff; stroke: #fff; }
.levelbox { flex: 0 1 520px; display: flex; flex-direction: column; align-items: center; gap: 2px; margin-top: -4px; }
.level { color: #fff; font-size: 30px; line-height: 1; -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; letter-spacing: 1px; }
.bar { position: relative; width: 100%; height: 22px; border-radius: 99px; background: rgba(27,20,64,.45); box-shadow: inset 0 3px 0 rgba(0,0,0,.18), 0 0 0 3px rgba(255,255,255,.9); }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 8%; border-radius: 99px; background: linear-gradient(#7ff0ff, #33d6ff 45%, #1e9fe0); box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); }
.bar .fill::after { content: ""; position: absolute; left: 10px; right: 10px; top: 3px; height: 5px; border-radius: 9px; background: rgba(255,255,255,.55); }
.bar .cap { position: absolute; top: 50%; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; transform: translate(-50%,-50%); background: #fff; box-shadow: 0 3px 0 rgba(27,20,64,.35); }
.bar .cap svg { width: 24px; height: 24px; }
.bar .cap.start { left: 0; } .bar .cap.start svg { fill: var(--blue); stroke: var(--blue); }
.bar .cap.end { left: 100%; background: var(--red); box-shadow: 0 3px 0 #b3122e; } .bar .cap.end svg { fill: #fff; }
.money { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.pill { display: flex; align-items: center; gap: 8px; min-width: 150px; height: 46px; padding: 0 18px 0 6px; border-radius: 99px; background: rgba(27,20,64,.55); box-shadow: inset 0 2px 0 rgba(255,255,255,.12); color: #fff; font-size: 27px; justify-content: space-between; }
.pill b { font-weight: 800; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; }
i.coin { width: 36px; height: 36px; border-radius: 50%; display: inline-block; background: radial-gradient(circle at 38% 32%, #fff6b0 0 12%, #ffd23f 13% 52%, #ffc21a 53% 62%, #e08a00 63%); box-shadow: 0 2px 0 #b06a00, inset 0 0 0 3px #e08a00; flex: none; }
i.gem { width: 30px; height: 30px; margin: 0 3px; display: inline-block; transform: rotate(45deg); border-radius: 6px; background: linear-gradient(135deg, #ffb0f0, #ff4fd8 45%, #c21fa6); box-shadow: 0 2px 0 #8f167a; flex: none; }
.hint { position: absolute; left: 50%; bottom: 128px; z-index: 1; transform: translateX(-50%); color: #fff; font-size: 22px; padding: 8px 22px; border-radius: 99px; background: rgba(27,20,64,.45); white-space: nowrap; }
.balloon { position: absolute; left: 0; top: 0; transform: translate(-50%,-100%); min-width: 66px; height: 54px; padding: 0 16px; border-radius: 99px; display: grid; place-items: center; font-size: 38px; color: #fff; background: linear-gradient(#5a8bff, #2f6bff); box-shadow: 0 0 0 4px #fff, 0 6px 0 4px rgba(27,20,64,.25); -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; line-height: 1; padding-top: 4px; }
.balloon::after { content: ""; position: absolute; left: 50%; bottom: -13px; transform: translateX(-50%); border: 9px solid transparent; border-top: 10px solid #fff; }
.balloon.enemy { background: linear-gradient(#ff7383, #ff3b4e); }
.balloon.bump { animation: bump .28s ease-out; }
@keyframes bump { 0% { scale: 1; } 35% { scale: 1.35; } 100% { scale: 1; } }
.popup { position: absolute; left: 0; top: 0; font-weight: 800; -webkit-text-stroke: 10px var(--ink); paint-order: stroke fill; white-space: nowrap; text-shadow: 0 6px 0 rgba(27,20,64,.35); }
.popup.good { color: #fff; }
.title-pill { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 26px 0 16px; border-radius: 99px; background: rgba(255,255,255,.92); color: var(--ink); font-size: 28px; box-shadow: 0 5px 0 rgba(27,20,64,.18); }
.title-pill svg { width: 30px; height: 30px; fill: var(--blue); }
.bottom { position: absolute; left: 0; right: 0; bottom: 26px; display: flex; justify-content: center; align-items: flex-end; gap: 22px; }
.btn { border: 0; cursor: pointer; display: flex; align-items: center; gap: 12px; height: 84px; padding: 0 30px 0 18px; border-radius: 26px; color: #fff; font-family: inherit; font-size: 32px; position: relative; }
.btn::after { content: ""; position: absolute; left: 14px; right: 14px; top: 7px; height: 18px; border-radius: 99px; background: rgba(255,255,255,.3); }
.btn.green { background: linear-gradient(#6af08c, var(--green)); box-shadow: 0 7px 0 var(--green-d), 0 14px 22px rgba(27,20,64,.28); }
.btn.blue { background: linear-gradient(#5a8bff, var(--blue)); box-shadow: 0 7px 0 var(--blue-d), 0 14px 22px rgba(27,20,64,.28); }
.btn.big { height: 100px; font-size: 40px; padding: 0 40px 0 22px; }
.btn .ic svg { width: 44px; height: 44px; fill: #fff; stroke: #fff; filter: drop-shadow(0 3px 0 rgba(27,20,64,.35)); }
.btn .lbl { display: flex; flex-direction: column; align-items: flex-start; line-height: .95; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; }
.btn .lbl small { display: flex; align-items: center; gap: 6px; font-size: 22px; -webkit-text-stroke: 4px var(--ink); margin-top: 4px; }
.btn .lbl small i.coin { width: 22px; height: 22px; }
.tag { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 4px; padding: 3px 14px 3px 5px; border-radius: 99px; background: rgba(255,255,255,.95); color: var(--ink); font-size: 22px; box-shadow: 0 4px 0 rgba(27,20,64,.2); white-space: nowrap; }
.tag i.coin { width: 26px; height: 26px; }
.tag small { font-size: 15px; opacity: .65; margin-left: 1px; }
.tag::after { content: ""; position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); border: 7px solid transparent; border-top: 8px solid rgba(255,255,255,.95); }
.tag.build { background: var(--gold); padding: 5px 16px 5px 8px; font-size: 22px; animation: float 1.6s ease-in-out infinite; }
.tag.build::after { border-top-color: var(--gold); }
.tag .hm { width: 30px; height: 30px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
.tag .hm svg { width: 20px; height: 20px; fill: var(--gold-d); }
@keyframes float { 50% { margin-top: -6px; } }
.offline { position: absolute; left: 22px; top: 96px; padding: 10px 18px; border-radius: 20px; background: rgba(27,20,64,.55); color: #fff; }
.offline .o1 { font-size: 17px; opacity: .9; max-width: 240px; line-height: 1.15; }
.offline .o2 { display: flex; align-items: center; gap: 8px; font-size: 30px; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(#3fb4ff, #fff1cf); color: #fff; font-size: 54px; -webkit-text-stroke: 9px #1b1440; paint-order: stroke fill; transition: opacity .4s; z-index: 5; }
#loading.done { opacity: 0; pointer-events: none; }
#loading .lb { width: 320px; height: 22px; border-radius: 99px; background: rgba(27,20,64,.4); margin-top: 12px; overflow: hidden; }
#loading .lb div { height: 100%; width: 0; background: var(--green); border-radius: 99px; }
#loading small { display: block; font-size: 18px; -webkit-text-stroke: 0; color: #1b1440; opacity: .7; text-align: center; margin-top: 14px; }
/* em pé (celular): HUD mais compacto */
body.portrait .top { padding: 12px 12px; gap: 8px; }
body.portrait .round { width: 46px; height: 46px; } body.portrait .round svg { width: 22px; height: 22px; }
body.portrait .level { font-size: 24px; }

body.portrait .title-pill { font-size: 20px; height: 42px; padding: 0 14px 0 10px; } body.portrait .title-pill svg { width: 22px; height: 22px; }

body.portrait .tag { font-size: 17px; } body.portrait .tag i.coin { width: 20px; height: 20px; }

/* ---- botões 9-slice (Kenney UI Pack, CC0) com estado pressionado ---- */
/* botões desenhados em CSS (antes: 9-slice Kenney, que deixava costuras finas com a escala fracionária do HUD).
   Mesmo visual: corpo arredondado com degradê, brilho em cima, "lábio" escuro embaixo e sombra. */
.kbtn { --b1: #5fe07a; --b2: #2fb84f; --b3: #1d8a3a; position: relative; border: 3px solid rgba(20,16,52,.55); border-radius: 18px; background: linear-gradient(180deg, var(--b1) 0%, var(--b1) 46%, var(--b2) 54%, var(--b2) 100%); box-shadow: inset 0 3px 0 rgba(255,255,255,.45), inset 0 -5px 0 rgba(0,0,0,.16), 0 7px 0 var(--b3), 0 10px 14px rgba(20,16,52,.3); cursor: pointer; font-family: inherit; color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-width: 200px; height: 70px; margin-bottom: 7px; padding: 0 44px 2px; font-size: 30px; pointer-events: auto; transition: transform .08s, box-shadow .08s; }
.kbtn.down { transform: translateY(5px); box-shadow: inset 0 3px 0 rgba(255,255,255,.4), inset 0 -4px 0 rgba(0,0,0,.16), 0 2px 0 var(--b3), 0 4px 8px rgba(20,16,52,.3); }
.kbtn.blue { --b1: #5cb3ff; --b2: #2d7fe8; --b3: #1b52a6; }
.kbtn.gold { --b1: #ffd84d; --b2: #f4a911; --b3: #b06f00; }
.kbtn.red { --b1: #ff6f7e; --b2: #e2364c; --b3: #9e1730; }
.kbtn.grey { filter: grayscale(1) brightness(.9); }
.kbtn .lbl { display: flex; flex-direction: column; align-items: flex-start; line-height: .95; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; white-space: nowrap; margin: -14px -6px -18px; }
.kbtn .lbl small { display: flex; align-items: center; gap: 6px; font-size: 21px; -webkit-text-stroke: 4px var(--ink); margin-top: 3px; }
.kbtn .lbl small i.coin { width: 21px; height: 21px; }
.kbtn .ic { margin: -14px 0 -18px -8px; } .kbtn .ic svg { width: 40px; height: 40px; fill: #fff; stroke: #fff; filter: drop-shadow(0 3px 0 rgba(27,20,64,.45)); }
.kbtn.big { height: 88px; min-width: 300px; font-size: 42px; }
.kbtn.small { height: 56px; min-width: 150px; font-size: 22px; padding: 0 30px 2px; border-radius: 15px; } .kbtn.small .ic svg { width: 28px; height: 28px; }
.kbtn.icon-only { min-width: 76px; padding: 0 14px 2px; } .kbtn.icon-only .ic { margin: -14px -6px -18px; }
.kbtn.pulse { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.kround { width: 62px; height: 62px; border: 0; background: url(ui/round-blue.png) center/contain no-repeat; display: grid; place-items: center; cursor: pointer; padding-bottom: 6px; pointer-events: auto; }
.kround.down { background-image: url(ui/round-blue-down.png); transform: translateY(4px); }
.kround svg { width: 28px; height: 28px; fill: #fff; stroke: #fff; filter: drop-shadow(0 2px 0 rgba(27,20,64,.4)); }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; pointer-events: auto; }
.screen .row { display: flex; gap: 16px; }
.menu { background: radial-gradient(ellipse at center 40%, rgba(27,20,64,0) 30%, rgba(27,20,64,.35) 100%); justify-content: flex-end; padding-bottom: calc(8vh / var(--ui)); }
.logo { position: absolute; top: calc(9vh / var(--ui)); display: flex; flex-direction: column; align-items: center; line-height: .8; transform: rotate(-3deg); }
.logo span { font-size: min(calc(15vw / var(--ui)), 150px); color: #fff; -webkit-text-stroke: 16px var(--ink); paint-order: stroke fill; text-shadow: 0 10px 0 rgba(27,20,64,.45); letter-spacing: 2px; }
.logo .l2 { color: #ffd23f; font-size: min(calc(17vw / var(--ui)), 170px); margin-top: -10px; }
.menu-level { color: #fff; font-size: 32px; -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; }
.money.corner { position: absolute; top: 18px; right: 22px; }
.credit { position: absolute; bottom: 10px; right: 16px; color: #fff; font-size: 15px; opacity: .85; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
.modal { position: absolute; inset: 0; background: rgba(27,20,64,.55); display: grid; place-items: center; pointer-events: auto; z-index: 3; }
.panel { position: relative; background: linear-gradient(#ffffff, #eef1ff); border-radius: 30px; padding: 26px 34px 30px; box-shadow: 0 10px 0 #b9b0f0, 0 22px 50px rgba(27,20,64,.45); display: flex; flex-direction: column; align-items: center; gap: 16px; min-width: min(520px, calc(90vw / var(--ui))); max-width: calc(92vw / var(--ui)); color: var(--ink); }
.panel h2 { margin: 0; font-size: 40px; }
.panel .x { position: absolute; top: -14px; right: -14px; width: 54px; height: 54px; border: 0; background: url(ui/round-red.png) center/contain no-repeat; cursor: pointer; padding-bottom: 5px; } .panel .x svg { width: 22px; height: 22px; stroke: #fff; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; width: 100%; font-size: 26px; flex-wrap: wrap; }
.langs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.lang { border: 0; border-radius: 14px; padding: 8px 12px; font-family: system-ui, sans-serif; font-weight: 700; font-size: 17px; background: #e3e0ff; color: var(--ink); cursor: pointer; box-shadow: 0 4px 0 #b9b0f0; }
.lang.sel { background: var(--blue); color: #fff; box-shadow: 0 4px 0 var(--blue-d); }
.credit2 { font-size: 14px; opacity: .7; text-align: center; }
.result { background: rgba(27,20,64,.6); }
.ribbon { font-size: 54px; color: #fff; padding: 6px 60px 14px; background: linear-gradient(#5a8bff, #2f6bff); border-radius: 22px; box-shadow: 0 8px 0 var(--blue-d); -webkit-text-stroke: 9px var(--ink); paint-order: stroke fill; animation: drop .5s cubic-bezier(.3,1.6,.6,1); }
.ribbon.red { background: linear-gradient(#ff7383, #ff3b4e); box-shadow: 0 8px 0 #b3122e; }
@keyframes drop { from { transform: translateY(-120px) scale(.6); opacity: 0; } }
.stars { display: flex; gap: 10px; } .stars i { width: 64px; height: 64px; background: url(ui/star.png) center/contain no-repeat; animation: drop .5s cubic-bezier(.3,1.6,.6,1) backwards; } .stars i:nth-child(2) { width: 84px; height: 84px; animation-delay: .15s; margin-top: -14px; } .stars i:nth-child(3) { animation-delay: .3s; }
.earn { display: flex; flex-direction: column; align-items: center; color: #fff; font-size: 24px; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; }
.earn b { display: flex; align-items: center; gap: 10px; font-size: 64px; -webkit-text-stroke: 10px var(--ink); } .earn b i.coin { width: 54px; height: 54px; }
.earn small { font-size: 18px; opacity: .85; -webkit-text-stroke: 3px var(--ink); }
.rec { color: #ffd23f; font-size: 40px; -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; animation: pulse .6s infinite; }
.meter { position: relative; width: 300px; height: 150px; overflow: hidden; }
.meter .arc { position: absolute; inset: 0 0 -150px 0; border-radius: 50%; background: conic-gradient(from -90deg, #ff8a1f 0 36deg, #ffc21a 36deg 72deg, #3ddc6a 72deg 108deg, #ffc21a 108deg 144deg, #ff8a1f 144deg 180deg, transparent 180deg); box-shadow: inset 0 0 0 8px rgba(27,20,64,.35); }
.meter .z { position: absolute; color: #fff; font-size: 24px; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; }
.meter .z2 { left: 18px; top: 104px; } .meter .z3 { left: 58px; top: 34px; } .meter .z5 { left: 130px; top: 8px; } .meter .z3b { right: 58px; top: 34px; } .meter .z2b { right: 18px; top: 104px; }
.needle { position: absolute; left: 146px; bottom: 0; width: 8px; height: 128px; background: var(--ink); border-radius: 8px; transform-origin: 50% 100%; }
.needle::after { content: ""; position: absolute; left: -10px; bottom: -14px; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); }
.lose-txt { color: #fff; font-size: 30px; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; }
.bossbar { display: none; position: relative; width: 82%; height: 26px; margin-top: 10px; border-radius: 99px; background: rgba(27,20,64,.6); box-shadow: 0 0 0 3px #fff; overflow: hidden; }
.bossbar.on { display: block; animation: drop .4s; }
.bossbar .bfill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(#ff8a96, #ff3b4e 55%, #b3122e); transition: width .15s; }
.bossbar span { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 17px; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; }
.hint { opacity: 0; transition: opacity .4s; } .hint.on { opacity: 1; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; } #flash.go { animation: flash .6s ease-out; }
@keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }
.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 4; }

.offline { transition: opacity .6s, transform .6s; } .offline.bye { opacity: 0; transform: translateY(-20px); }
.prod { position: absolute; left: 50%; top: 84px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 4px 16px 4px 6px; border-radius: 99px; background: rgba(27,20,64,.55); color: #fff; font-size: 24px; }
.prod b { -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; } .prod small { font-size: 15px; opacity: .8; }
.done-pill { color: #fff; font-size: 28px; padding: 14px 24px; border-radius: 22px; background: rgba(27,20,64,.55); }
body.portrait .kbtn { min-width: 150px; height: 64px; font-size: 24px; } body.portrait .kbtn.big { height: 80px; min-width: 240px; font-size: 32px; }
body.portrait .ribbon { font-size: 34px; padding: 4px 30px 10px; } body.portrait .earn b { font-size: 48px; }
body.portrait .bottom { gap: 10px; flex-wrap: wrap; } body.portrait .kround { width: 50px; height: 50px; }

/* ---- rodada 3: escala do HUD por tamanho de janela, camada do mundo, artes do dono ---- */
:root { --ui: 1; }
#hud { zoom: var(--ui); }
#world { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
img.coin { width: 36px; height: 36px; object-fit: contain; flex: none; filter: drop-shadow(0 2px 0 rgba(27,20,64,.35)); }
.kbtn .lbl small img.coin { width: 22px; height: 22px; } .tag img.coin { width: 26px; height: 26px; } .earn b img.coin { width: 56px; height: 56px; } .prod img.coin, .offline img.coin { width: 30px; height: 30px; }
img.vid { width: 46px; height: 46px; object-fit: contain; }
.logo-img { position: absolute; top: calc(2vh / var(--ui)); width: min(calc(40vw / var(--ui)), 520px); filter: drop-shadow(0 10px 0 rgba(27,20,64,.35)); animation: logoIn .7s cubic-bezier(.3,1.5,.6,1); }
body.portrait .logo-img { width: calc(88vw / var(--ui)); top: calc(8vh / var(--ui)); }
@keyframes logoIn { from { transform: scale(.6) translateY(-60px); opacity: 0; } }
